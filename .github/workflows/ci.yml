name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore EXE-FAIEnglishTutor.sln
      working-directory: ./EXE-FAIEnglishTutor
      
    - name: Build project
      run: dotnet build EXE-FAIEnglishTutor.sln --configuration Release --no-restore
      working-directory: ./EXE-FAIEnglishTutor
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./EXE-FAIEnglishTutor
        file: ./EXE-FAIEnglishTutor/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/fai-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/azureuser/aitutor_deploy
          
          # Cáº­p nháº­t mÃ£ nguá»“n má»›i nháº¥t
          git pull origin dev
          
          # KÃ©o image má»›i nháº¥t vá» tá»« Docker Hub
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fai-app:latest
          
          # Táº¡o láº¡i file .env tá»« Github Secrets Ä‘á»ƒ docker-compose cÃ³ thá»ƒ Ä‘á»c
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          echo "CLOUDINARY_CLOUDNAME=${{ secrets.CLOUDINARY_CLOUDNAME }}" >> .env
          echo "CLOUDINARY_APIKEY=${{ secrets.CLOUDINARY_APIKEY }}" >> .env
          echo "CLOUDINARY_APISECRET=${{ secrets.CLOUDINARY_APISECRET }}" >> .env
          echo "OPENAI_APIKEY=${{ secrets.OPENAI_APIKEY }}" >> .env
          echo "AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}" >> .env
          echo "AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION }}" >> .env
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GEMINI_APIKEY=${{ secrets.GEMINI_APIKEY }}" >> .env
          echo "FACEBOOK_APPID=${{ secrets.FACEBOOK_APPID }}" >> .env
          echo "FACEBOOK_APPSECRET=${{ secrets.FACEBOOK_APPSECRET }}" >> .env
          echo "TWITTER_APIKEY=${{ secrets.TWITTER_APIKEY }}" >> .env
          echo "TWITTER_APIKEYSECRET=${{ secrets.TWITTER_APIKEYSECRET }}" >> .env
          echo "PayOS__ClientId=${{ secrets.PAYOS_CLIENT_ID }}" >> .env
          echo "PayOS__ApiKey=${{ secrets.PAYOS_API_KEY }}" >> .env
          echo "PayOS__ChecksumKey=${{ secrets.PAYOS_CHECKSUM_KEY }}" >> .env
          
          # Chạy lại docker-compose
          sudo docker compose up -d --remove-orphans
          # Dá»n dáº¹p image cÅ© cho nháº¹ mÃ¡y
          sudo docker image prune -f


