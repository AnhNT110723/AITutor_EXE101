name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  # ============================================================
  # JOB 1: Build code, dong goi va day Docker image len Docker Hub
  # ============================================================
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cai dat moi truong .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Khoi phuc thu vien (restore dependencies)
      run: dotnet restore EXE-FAIEnglishTutor.sln
      working-directory: ./EXE-FAIEnglishTutor
      
    - name: Build du an (kiem tra loi compile)
      run: dotnet build EXE-FAIEnglishTutor.sln --configuration Release --no-restore
      working-directory: ./EXE-FAIEnglishTutor
      
    - name: Dang nhap vao Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Dong goi image va day len Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: ./EXE-FAIEnglishTutor
        file: ./EXE-FAIEnglishTutor/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/fai-app:latest

  # ============================================================
  # JOB 2: Deploy len VPS (chi chay khi push/merge vao nhanh dev)
  # Mo hinh bao mat chuan doanh nghiep:
  #   - VPS khong dung Git, khong luu ma nguon
  #   - CI/CD runner dung SCP day file cau hinh len VPS
  #   - VPS chi keo Docker image da dong goi tu Docker Hub
  # ============================================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    steps:
    - name: Checkout code de lay file docker-compose.yml moi nhat
      uses: actions/checkout@v4

    - name: Copy docker-compose.yml len VPS qua SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        source: "EXE-FAIEnglishTutor/docker-compose.yml"
        target: "/home/azureuser/aitutor_deploy/"
        strip_components: 1

    - name: Trien khai len VPS qua SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /home/azureuser/aitutor_deploy
          
          # Buoc 1: Keo image moi nhat tu Docker Hub ve VPS
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fai-app:latest
          
          # Buoc 2: Tao lai file .env tu Github Secrets (ghi de toan bo)
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
          echo "CLOUDINARY_CLOUDNAME=${{ secrets.CLOUDINARY_CLOUDNAME }}" >> .env
          echo "CLOUDINARY_APIKEY=${{ secrets.CLOUDINARY_APIKEY }}" >> .env
          echo "CLOUDINARY_APISECRET=${{ secrets.CLOUDINARY_APISECRET }}" >> .env
          echo "OPENAI_APIKEY=${{ secrets.OPENAI_APIKEY }}" >> .env
          echo "AZURE_SPEECH_KEY=${{ secrets.AZURE_SPEECH_KEY }}" >> .env
          echo "AZURE_SPEECH_REGION=${{ secrets.AZURE_SPEECH_REGION }}" >> .env
          echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
          echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env
          echo "GEMINI_APIKEY=${{ secrets.GEMINI_APIKEY }}" >> .env
          echo "FACEBOOK_APPID=${{ secrets.FACEBOOK_APPID }}" >> .env
          echo "FACEBOOK_APPSECRET=${{ secrets.FACEBOOK_APPSECRET }}" >> .env
          echo "TWITTER_APIKEY=${{ secrets.TWITTER_APIKEY }}" >> .env
          echo "TWITTER_APIKEYSECRET=${{ secrets.TWITTER_APIKEYSECRET }}" >> .env
          echo "PAYOS_CLIENT_ID=${{ secrets.PAYOS_CLIENT_ID }}" >> .env
          echo "PAYOS_API_KEY=${{ secrets.PAYOS_API_KEY }}" >> .env
          echo "PAYOS_CHECKSUM_KEY=${{ secrets.PAYOS_CHECKSUM_KEY }}" >> .env

          # Buoc 3: Khoi dong lai cac container voi image va cau hinh moi nhat
          sudo docker compose up -d --remove-orphans

          # Buoc 4: Don dep image cu khong con dung de tiet kiem dung luong VPS
          sudo docker image prune -f