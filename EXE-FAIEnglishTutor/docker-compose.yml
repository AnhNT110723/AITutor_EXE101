version: '3.8'

services:
  fai-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fai-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-YourStrong!Passw0rd}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fai-app
    ports:
      - "80:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FAI_ENGLISH=Server=fai-db;Database=FAI_ENGLISH;User Id=sa;Password=${DB_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=true;
      - Cloudinary__CloudName=${CLOUDINARY_CLOUDNAME}
      - Cloudinary__ApiKey=${CLOUDINARY_APIKEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_APISECRET}
      - OpenAI__ApiKey=${OPENAI_APIKEY}
      - OpenAI__Endpoint=https://api.openai.com/v1/chat/completions
      - Azure__Speech__SubscriptionKey=${AZURE_SPEECH_KEY}
      - Azure__Speech__Region=${AZURE_SPEECH_REGION}
      - EmailSettings__SmtpHost=smtp.gmail.com
      - EmailSettings__SmtpPort=587
      - EmailSettings__FromEmail=${EMAIL_FROM}
      - EmailSettings__FromPassword=${EMAIL_PASSWORD}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Gemini__ApiKey=${GEMINI_APIKEY}
      - Gemini__BaseUrl=https://generativelanguage.googleapis.com/v1beta/models
      - Gemini__Model=gemini-flash-lite-latest
      - Facebook__AppId=${FACEBOOK_APPID}
      - Facebook__AppSecret=${FACEBOOK_APPSECRET}
      - Twitter__APIKey=${TWITTER_APIKEY}
      - Twitter__APIKeySecret=${TWITTER_APIKEYSECRET}
      - PayOS__ClientId=${PayOS__ClientId}
      - PayOS__ApiKey=${PayOS__ApiKey}
      - PayOS__ChecksumKey=${PayOS__ChecksumKey}
    depends_on:
      fai-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
